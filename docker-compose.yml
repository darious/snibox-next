services:
  snibox:
    build: .
    # image: ghcr.io/darious1472/snibox-next:latest
    container_name: snibox
    restart: unless-stopped
    # Bind only on the docker host's loopback. Front this with nginx / Caddy /
    # nginx-proxy-manager that does the auth (see SPEC §1.1 — Auth is OUT
    # of scope for v1 of snibox itself).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      SNIBOX_ADDR: 0.0.0.0:8080
      SNIBOX_DB: /data/snibox.db
      SNIBOX_TRUST_NETWORK: "true"
      # SNIBOX_SEED_DEMO: "true"
      # SNIBOX_READ_ONLY: "true"
