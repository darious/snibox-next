name: test

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Generate templ
        run: templ generate
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -cover
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/snibox ./cmd/snibox
