# First-time setup:
#   mkdir -p /mnt/config/q-docker/service-data/snibox-next
#   chown 10001:10001 /mnt/config/q-docker/service-data/snibox-next
# The container runs as uid 10001 (non-root). If the bind-mount isn't
# writable by that uid you'll see "open db: unable to open database file (14)".

services:
  snibox-next:
    image: ghcr.io/darious/snibox-next:latest
    container_name: snibox-next
    restart: unless-stopped
    # nginx-proxy-manager on the `web` network fronts this with auth + TLS.
    # See SPEC §1.1 — auth is out of scope inside the app itself.
    ports:
      - "8979:8979"
    volumes:
      - /mnt/config/q-docker/service-data/snibox-next:/data
    environment:
      SNIBOX_ADDR: 0.0.0.0:8979
      SNIBOX_DB: /data/snibox.db
      SNIBOX_TRUST_NETWORK: "true"
      # SNIBOX_READ_ONLY: "true"     # uncomment to make the instance read-only
      # SNIBOX_SEED_DEMO: "true"     # only on a fresh empty database
    labels:
      # Watched by WUD — :latest tag, notify on new digest.
      - wud.watch=true
      - wud.watch.digest=true
    networks:
      - web

networks:
  web:
    external: true
